<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>សារស្នេហា</title>
    <style>
        body {
            background-color: #ffe6e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Khmer OS Siemreap', sans-serif;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .heart {
            color: #ff4d4d;
            font-size: 50px;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        h1 {
            color: #d63031;
            font-size: 24px;
        }
        p {
            color: #555;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>សម្រាប់ជាតា</h1>
        <p>អរគុណដែលបានចូលមកក្នុងជីវិតបងបងពិតជាអគុណអូនណាស់​ តាំងពីមានអូនក្នុងជីវិតមក ពិភពលោករបស់បងពោរពេញដោយក្តីសុខទោះថ្ងៃអនាគតមានរឿងអ្វីកើតឡើងក៏ដោយ ក៏បងដឹងថាបេះដូងមួយនេះមានតែអូនម្នាក់គត់ដែរ 💖</p>
    </div>

</body>
</html>
